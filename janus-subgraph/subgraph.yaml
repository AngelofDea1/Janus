specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Vault
    network: arc-testnet
    source:
      address: "0x764bd84928249ead3ce79e164bd94531841b3c2a"
      abi: Vault
      startBlock: 44630000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ArbitrageExecution
        - YieldHarvest
        - Deposit
        - Withdraw
        - VaultMetric
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: ArbitrageExecuted(string,string,uint256,string,uint256)
          handler: handleArbitrageExecuted
        - event: ArbitrageYieldHarvested(indexed uint256,uint256)
          handler: handleArbitrageYieldHarvested
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/mapping.ts
  - kind: ethereum
    name: EURCVault
    network: arc-testnet
    source:
      address: "0xb8d81f1874fe9679a5512ad3acfc22755498b153"
      abi: Vault
      startBlock: 44630000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ArbitrageExecution
        - YieldHarvest
        - Deposit
        - Withdraw
        - VaultMetric
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: ArbitrageExecuted(string,string,uint256,string,uint256)
          handler: handleArbitrageExecuted
        - event: ArbitrageYieldHarvested(indexed uint256,uint256)
          handler: handleArbitrageYieldHarvested
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/mapping.ts
